        description: "Ticket priority list with SLA hours. Priority comes as 'P1 Notfall' etc."
      - name: tickets
        description: "Maintenance ticket export. DELIBERATELY messy for teaching: lowercase IDs, mixed date formats, 25 duplicate rows, 3 TEST rows."
