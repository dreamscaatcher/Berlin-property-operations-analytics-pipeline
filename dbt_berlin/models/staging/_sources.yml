version: 2

sources:
  - name: raw
    description: "Raw tables loaded by scripts/load_raw.py. Never edited by dbt. Synthetic data."
    schema: raw
    tables:
      - name: properties
        description: "Property master data exported from the property system (all text)."
      - name: units
        description: "Rental units (flats, shops, offices), one row per unit (all text)."
